[build]
  command = "npm run build"
  publish = ".output/public"

# ── Security Headers ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── SPA Fallback — all routes → index.html ───────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
